name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: "Deployed Niyra AI web app URL to wrap in the APK"
        required: true
        default: "https://niyraai.onrender.com"
  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        env:
          WEB_URL: ${{ github.event.inputs.web_url || 'https://niyraai.onrender.com' }}
        run: gradle :android:app:assembleDebug -PNIYRA_WEB_URL="$WEB_URL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: niyra-ai-debug-apk
          path: android/app/build/outputs/apk/debug/android-app-debug.apk
